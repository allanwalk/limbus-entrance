<style>
:root{color-scheme:dark;font-family:system-ui,"Noto Sans TC",sans-serif;background:#111315;color:#ece5d8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% 0%,#392222 0%,transparent 50%),#111315}main{max-width:760px;margin:auto;padding:40px 22px 70px}header{display:flex;justify-content:space-between;gap:12px;align-items:center;color:#ba9e82;font-size:.8rem;letter-spacing:.12em}h1{font-size:clamp(2.3rem,7vw,4.4rem);line-height:1.2;margin:65px 0 24px;letter-spacing:.04em}h2{font-size:1.7rem;line-height:1.4}p{line-height:1.95;color:#c8c0b4}small,.muted{color:#9b9389}.rule{height:1px;background:#56413d;margin:28px 0}.panel{background:#1e2023;border:1px solid #4a3a35;border-radius:14px;padding:24px;margin-top:25px;box-shadow:0 15px 40px #0005}.eyebrow{color:#bd766a;letter-spacing:.2em;font-size:.82rem}.choices{display:grid;gap:12px;margin-top:26px}button{font:inherit;cursor:pointer;text-align:left;color:#eee7dc;background:#282a2d;border:1px solid #5c5550;border-radius:9px;padding:16px 19px;transition:.18s}button:hover,button:focus-visible{border-color:#cf8b7e;background:#3b302f;outline:2px solid transparent}button.primary{background:#8e3533;border-color:#b75b53;font-weight:700;text-align:center}button.primary:hover{background:#a94741}button.secondary{background:transparent}#progress{font-size:.83rem;color:#ad9e91}footer{margin-top:60px;font-size:.78rem;color:#99918a;line-height:1.8}a{color:#d9a394}#screen{min-height:380px}#ending{border-left:3px solid #a8564e;padding-left:20px}#card{display:none} .stats{display:flex;gap:12px;flex-wrap:wrap}.stat{flex:1;min-width:130px;background:#2b2b2d;border-radius:8px;padding:15px}.stat strong{display:block;font-size:1.5rem;color:#f1d0b1}@media(max-width:520px){main{padding-top:25px}h1{margin-top:45px}.panel{padding:18px}}
</style></head><body><main><header><span>UNKNOWN TRANSMISSION / 001</span><span>非官方粉絲企劃</span></header>
<div id="screen" aria-live="polite"></div><footer><div class="rule"></div>本網站為免費、非營利的獨立粉絲互動創作，與 Project Moon 無隸屬或官方合作關係。所有故事、視覺及程式碼均為本企劃原創；《Limbus Company》等名稱與相關世界觀權利屬其權利人。<br>不要求登入、不使用追蹤器；遊玩進度只儲存在你的瀏覽器。<a href="./PRIVACY.md">隱私說明</a> · <a href="./FAN_CONTENT.md">二次創作聲明</a></footer></main>
<script>
"use strict";
const scenes=[
{title:"有人在敲你的門。",body:"現在是凌晨 3 點 17 分。門外有個陌生女人，她渾身是血，說只要你讓她躲十分鐘，就會給你足夠生活一年的錢。巷口站著三個穿著整齊的人，其中一個正在微笑。",choices:[["讓她進來。先救人再說。","compassion", "她衝進門，將一張沾血的收據塞進你手裡。收據上寫著你的名字。"],["關上門。這不是我該管的事。","caution","你鎖上門。三分鐘後，敲門聲再次響起。這次有人叫出了你的全名。"],["先問清楚：他們為什麼追你？","inquiry","她低聲說：知道答案的人，就不能再假裝不知道。"]]},
{title:"一份不合理的契約。",body:"有人從門縫遞進一份契約：只要簽字，今晚所有人都能平安。但條款最後一行寫著：『代價由未署名者承擔。』",choices:[["拒絕讓陌生人替我付出代價。","compassion","你撕毀契約。外頭的腳步聲突然停了。"],["仔細檢查條款，尋找漏洞。","inquiry","你發現簽名欄位其實有兩個。"],["保留契約，先確保自己活下去。","caution","你把紙摺進口袋，卻發現它正在慢慢變熱。"]]},
{title:"都市的早晨。",body:"你終於走出巷子。電子看板寫著：『本區今日異常死亡事件：17 起，仍在正常範圍內。』旁邊的人繼續排隊買早餐。你會怎麼做？",choices:[["記住受害者，試著改變什麼。","compassion","你把那個數字記在心裡。"],["調查誰制定了這個「正常範圍」。","inquiry","你開始尋找公告背後的管理者。"],["先活下來，再決定要不要反抗。","caution","你融入人群，開始規劃下一步。"]]}];
const labels={compassion:"守護者",inquiry:"觀察者",caution:"倖存者"};
const descriptions={compassion:"你願意替陌生人承擔風險。但在都市，善意也需要界線。",inquiry:"你不願只接受別人提供的答案。真相可能成為武器，也可能成為負擔。",caution:"你知道活下來不是懦弱，而是下一次選擇的前提。"};
let state={step:0,answers:[],log:[]};try{const saved=JSON.parse(localStorage.getItem("city-entry-v1"));if(saved&&Number.isInteger(saved.step)&&saved.step>=0&&saved.step<=3&&Array.isArray(saved.answers)&&saved.answers.length===saved.step)state=saved}catch(e){}
const root=document.getElementById("screen");const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function save(){try{localStorage.setItem("city-entry-v1",JSON.stringify(state))}catch(e){}}
function start(){state={step:0,answers:[],log:[]};save();render()}
function choose(i){const scene=scenes[state.step],choice=scene.choices[i];if(!choice)return;state.answers.push(choice[1]);state.log.push(choice[2]);state.step++;save();render()}
function result(){const counts={compassion:0,inquiry:0,caution:0};state.answers.forEach(a=>counts[a]++);const winner=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]||["inquiry","compassion","caution"].indexOf(a)-["inquiry","compassion","caution"].indexOf(b))[0];return {type:winner,counts}}
function download(){const {type}=result(),canvas=document.createElement("canvas");canvas.width=1080;canvas.height=1350;const c=canvas.getContext("2d");c.fillStyle="#17191c";c.fillRect(0,0,1080,1350);c.fillStyle="#a64e46";c.fillRect(70,85,940,8);c.fillStyle="#c2a17c";c.font="34px sans-serif";c.fillText("CITY RESIDENT RECORD",85,170);c.fillStyle="#f3e9d8";c.font="bold 80px sans-serif";c.fillText("都市入境檔案",85,345);c.font="bold 105px sans-serif";c.fillText(labels[type],85,545);c.font="40px sans-serif";const txt=descriptions[type];const lines=txt.match(/.{1,17}/gu)||[txt];lines.forEach((l,i)=>c.fillText(l,85,690+i*68));c.fillStyle="#c6aaa0";c.font="29px sans-serif";c.fillText("免費・非官方粉絲互動企劃",85,1150);c.fillText(location.origin+location.pathname,85,1210);const a=document.createElement("a");a.download="city-resident-record.png";a.href=canvas.toDataURL("image/png");a.click()}
function render(){if(state.step===0&&state.answers.length===0){root.innerHTML='<h1>你確定自己能<br>活過今晚嗎？</h1><p>這座城市不會因為你是好人，就讓你活下來。</p><div class="panel"><span class="eyebrow">身分識別失敗</span><h2>一份來自都市的入境評估</h2><p>三段原創互動故事。無須了解任何背景，約 2 分鐘完成。你的選擇不分對錯。</p><button class="primary" id="begin">接受生存評估</button></div>';document.getElementById("begin").onclick=()=>{root.dataset.started="1";showScene()};return}if(state.step>=scenes.length){const r=result();root.innerHTML='<div class="panel"><span class="eyebrow">評估結束 / RESIDENT FILE</span><h1>'+labels[r.type]+'</h1><p id="ending">'+descriptions[r.type]+'</p><div class="stats"><div class="stat">守護傾向<strong>'+r.counts.compassion+'</strong></div><div class="stat">探究傾向<strong>'+r.counts.inquiry+'</strong></div><div class="stat">求生傾向<strong>'+r.counts.caution+'</strong></div></div><p>這是原創的都市生存傾向，不是經科學驗證的人格測驗，也不代表官方角色分類。</p><div class="choices"><button class="primary" id="download">下載結果 PNG</button><button id="restart">重新開始</button><a href="https://store.steampowered.com/app/1973530/Limbus_Company/" target="_blank" rel="noopener noreferrer">探索原作《Limbus Company》 ↗</a></div></div>';document.getElementById("download").onclick=download;document.getElementById("restart").onclick=start;return}showScene()}
function showScene(){const s=scenes[state.step];root.innerHTML='<div class="panel"><div id="progress">都市適性檢測 / 事件 '+String(state.step+1).padStart(3,"0")+' / 003</div><h2>'+esc(s.title)+'</h2><p>'+esc(s.body)+'</p>'+(state.log.length?'<p class="muted">前一個選擇的後果：'+esc(state.log[state.log.length-1])+'</p>':'')+'<div class="choices">'+s.choices.map((c,i)=>'<button data-choice="'+i+'">'+esc(c[0])+'</button>').join("")+'</div></div>';root.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>choose(Number(b.dataset.choice)))}
render();
</script></body></html>
